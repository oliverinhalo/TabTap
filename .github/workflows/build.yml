name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Everything that does not need a device: the pure-Kotlin music and I/O cores,
      # and the app's unit tests, which run the real database and compose the real
      # interface through Robolectric.
      - name: Run the tests
        run: ./gradlew --no-daemon :core-music:test :core-io:test :app:testDebugUnitTest

      - name: Build the debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Check the release build and its lint
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core-music/build/reports/tests/
            core-io/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
